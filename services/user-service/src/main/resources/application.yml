spring:
  application:
    name: user-service
  profiles:
    active: local
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true


  kafka:
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
logging:
  level:
    root: info
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:super-secret-key-that-should-be-in-a-vault}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days

# Account Service configuration
account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
  sync:
    batch-size: ${ACCOUNT_SYNC_BATCH_SIZE:50}
    delay: ${ACCOUNT_SYNC_DELAY:10000}

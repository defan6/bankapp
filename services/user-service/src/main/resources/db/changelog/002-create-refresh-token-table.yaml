databaseChangeLog:
  - changeSet:
      id: 002-create-refresh-token-table
      author: gemini
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: refresh_tokens
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refresh_tokens_user
                    references: users(id)
              - column:
                  name: expired_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false

databaseChangeLog:
  - changeSet:
      id: 001-initial-schema-history-service
      author: gemini
      changes:
        - createTable:
            tableName: transaction_history
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: source_account_id
                  type: UUID
                  constraints:
                    nullable: true # Может быть null для входящих транзакций
              - column:
                  name: destination_account_id
                  type: UUID
                  constraints:
                    nullable: true # Может быть null для исходящих транзакций
              - column:
                  name: amount
                  type: DECIMAL(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: event_timestamp
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_transaction_history_user_id
            tableName: transaction_history
            columns:
              - column:
                  name: user_id

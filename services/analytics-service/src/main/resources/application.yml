# ===================================
#      ОБЩИЕ НАСТРОЙКИ
# ===================================
spring:
  application:
    name: analytics-service
  profiles:
    default: local
  kafka:
    consumer:
      group-id: analytics-service-group
      auto-offset-reset: earliest
logging:
  level:
    root: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

# ===================================
#      ОБЩИЕ НАСТРОЙКИ
# ===================================
spring:
  application:
    name: api-gateway
server:
  port: 8080
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
---
# ===================================
#    ПРОФИЛЬ 'docker' (по умолчанию)
# ===================================
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Включаем автоматическое обнаружение сервисов
          lower-case-service-id: true
  redis:
    host: redis
    port: 6379
---
# ===================================
#       ПРОФИЛЬ 'local'
# ===================================
spring:
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/transactions/**
        - id: history-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/history/**
        - id: scheduler-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/schedules/**
  redis:
    host: localhost
    port: 6379

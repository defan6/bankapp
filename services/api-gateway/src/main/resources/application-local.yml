spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/transactions/**
        - id: history-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/history/**
        - id: scheduler-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/schedules/**
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8090
databaseChangeLog:
  - changeSet:
      id: 004-add-published-at-to-outbox
      author: gemini
      changes:
        - addColumn:
            tableName: outbox
            columns:
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
        - createIndex:
            indexName: idx_outbox_published_at
            tableName: outbox
            columns:
              - column:
                  name: published_at

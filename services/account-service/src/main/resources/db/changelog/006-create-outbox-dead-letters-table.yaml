databaseChangeLog:
  - changeSet:
      id: 006-create-outbox-dead-letters-table
      author: gemini
      changes:
        - createTable:
            tableName: outbox_dead_letters
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: outbox_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
              - column:
                  name: headers
                  type: TEXT
              - column:
                  name: event_timestamp
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: failed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: stack_trace
                  type: TEXT
        - createIndex:
            indexName: idx_outbox_dead_letters_outbox_id
            tableName: outbox_dead_letters
            columns:
              - column:
                  name: outbox_id
        - createIndex:
            indexName: idx_outbox_dead_letters_aggregate_id
            tableName: outbox_dead_letters
            columns:
              - column:
                  name: aggregate_id
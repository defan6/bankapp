spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/account_service_db
    username: bankapp
    password: password
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: kafka:9092
    properties:
      schema.registry.url: http://schema-registry:8081 # Schema Registry URL for Docker environment
management:
  otlp:
    endpoint: http://alloy:4318
    metrics:
      export:
        url: ${management.otlp.endpoint}/v1/metrics
    tracing:
      export:
        url: ${management.otlp.endpoint}/v1/traces
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'bankapp-local-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080'  # api-gateway
          - 'host.docker.internal:8081'  # user-service
          - 'host.docker.internal:8082'  # account-service
          - 'host.docker.internal:8083'  # transaction-service
          - 'host.docker.internal:8084'  # history-service
          - 'host.docker.internal:8085'  # notification-service
          - 'host.docker.internal:8086'  # analytics-service
          - 'host.docker.internal:8087'  # scheduler-service

  # =====================================================================================
  # ЗАДАЧА ДЛЯ СБОРА МЕТРИК С СЕРВИСОВ, ЗАПУЩЕННЫХ ВНУТРИ DOCKER
  # Используйте эту конфигурацию, когда все сервисы запущены через 'docker-compose up'
  # =====================================================================================
#  - job_name: 'bankapp-docker-services'
#    metrics_path: '/actuator/prometheus'
#    static_configs:
#      - targets:
#        - 'api-gateway:8080'
#        - 'user-service:8081'
#        - 'account-service:8082'
#        - 'transaction-service:8083'
#        - 'history-service:8084'
#        - 'notification-service:8085'
#        - 'analytics-service:8086'
#        - 'scheduler-service:8087'

  # =====================================================================================
  # ЗАДАЧА ДЛЯ СБОРА МЕТРИК С СЕРВИСОВ, ЗАПУЩЕННЫХ ЛОКАЛЬНО (В IDE)
  # Чтобы использовать, ЗАКОММЕНТИРУЙТЕ задачу 'bankapp-docker-services' выше
  # и РАСКОММЕНТИРУЙТЕ эту задачу.
  # Docker должен предоставлять специальный хост 'host.docker.internal'
  # =====================================================================================

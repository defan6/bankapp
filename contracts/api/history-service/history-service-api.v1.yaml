openapi: 3.0.3
info:
  title: History Service API
  version: 1.0.0
  description: API for retrieving user's transaction history.

paths:
  /api/history:
    get:
      summary: Get transaction history
      operationId: getHistory
      tags:
        - History
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: History retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HistoryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        page:
          type: integer
        size:
          type: integer
        totalPages:
          type: integer

    HistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [ INCOMING, OUTGOING ]
        source_account_id:
          type: string
          format: uuid
        destination_account_id:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        currency:
          type: string
        status:
          type: string
          enum: [ COMPLETED, FAILED ]
        event_timestamp:
          type: string
          format: date-time

openapi: 3.0.3
info:
  title: Account Service API
  version: 1.0.0
  description: API for managing user bank accounts.

servers:
  - url: / # The API Gateway will resolve the full path
    description: API Gateway

paths:
  /api/v1/accounts:
    get:
      summary: Get all accounts for the current user
      operationId: getUserAccounts
      tags:
        - Account
      security:
        - BearerAuth: [ ]
      parameters:
        - in: query
          name: userId
          description: userId
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of user accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'
    post:
      summary: Create a new account for the current user
      operationId: createAccount
      tags:
        - Account
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully.
          headers:
            Location:
              description: URL of the created account resource
              schema:
                type: string
                format: uri
                example: /api/accounts/42f9c2d1-7e2a-4c4b-9b7e-1a3c5d6e7f90
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'

  /api/v1/accounts/batch:
    post:
      summary: Create accounts for multiple users (batch operation)
      description: Internal API for creating accounts for multiple users in a single request. Used by user-service scheduler.
      operationId: createAccountsBatch
      tags:
        - Account
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '200':
          description: Batch operation completed. Returns list of results for each request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateAccountsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'

  /api/v1/accounts/{accountId}:
    get:
      summary: Get account by ID
      operationId: getAccountById
      tags:
        - Account
      security:
        - BearerAuth: [ ]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the account to retrieve.
      responses:
        '200':
          description: The requested account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden (user does not own this account)
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ApiErrorResponse'

components:
  schemas:
    CreateAccountRequest:
      type: object
      properties:
        userId:
          nullable: false
          type: string
          format: uuid
        currency:
          nullable: false
          type: string
          example: "RUB"
          description: "The currency for the new account (e.g., RUB, USD)."
      required:
        - currency

    AccountResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        balance:
          type: number
          format: bigdecimal # Using a string or number is a choice, bigdecimal is more of a hint
          description: "The current account balance."
        currency:
          type: string
          example: "RUB"
    CreateAccountResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        balance:
          type: number
          format: bigdecimal
          description: "The current account balance."
        currency:
          type: string
          example: "RUB"

    BatchCreateAccountsResponse:
      type: object
      description: Response for batch account creation operation
      properties:
        total:
          type: integer
          description: Total number of requests processed
        successCount:
          type: integer
          description: Number of successfully created accounts
        failedCount:
          type: integer
          description: Number of failed account creations
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchAccountResult'

    BatchAccountResult:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: User ID from the request
        success:
          type: boolean
          description: Whether the account was created successfully
        accountId:
          type: string
          format: uuid
          description: ID of the created account (if successful)
        error:
          type: string
          description: Error message (if failed)

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

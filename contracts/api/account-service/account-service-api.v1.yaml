openapi: 3.0.3
info:
  title: Account Service API
  version: 1.0.0
  description: API for managing user bank accounts.

servers:
  - url: / # The API Gateway will resolve the full path
    description: API Gateway

paths:
  /api/accounts:
    get:
      summary: Get all accounts for the current user
      operationId: getUserAccounts
      tags:
        - Accounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of user accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ErrorDto'
    post:
      summary: Create a new account for the current user
      operationId: createAccount
      tags:
        - Accounts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequestDto'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ErrorDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ErrorDto'

  /api/accounts/{accountId}:
    get:
      summary: Get account by ID
      operationId: getAccountById
      tags:
        - Accounts
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the account to retrieve.
      responses:
        '200':
          description: The requested account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ErrorDto'
        '403':
          description: Forbidden (user does not own this account)
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ErrorDto'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '../common/common.v1.yaml#/components/schemas/ErrorDto'

components:
  schemas:
    CreateAccountRequestDto:
      type: object
      properties:
        currency:
          type: string
          example: "RUB"
          description: "The currency for the new account (e.g., RUB, USD)."
      required:
        - currency

    AccountDto:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        balance:
          type: number
          format: bigdecimal # Using a string or number is a choice, bigdecimal is more of a hint
          description: "The current account balance."
        currency:
          type: string
          example: "RUB"
      required:
        - accountId
        - userId
        - balance
        - currency

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
